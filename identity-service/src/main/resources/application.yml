spring:
  application:
    name: identity-service
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userstore}
    username: ${DB_USER:cipher}
    password: ${DB_PASS:secret}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Production standard: Do not let Hibernate change your schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Application Specific Properties
app:
  jwtSecret: ${JWT_SECRET:o4iosOSBFOzaIP/wRgnE99wdKlF95ihqbA9eCmPWFQySUZafsJxrpOF4PnRmm1EBe7vj4Dt9iX3elKPey+Uucw==}
  jwtExpirationMs: 86400000 # 24 hours

# Server Port
server:
  port: 8081 # Common practice: Identity service runs on its own dedicated port

eureka:
  instance:
    # This tells Eureka to use the IP address instead of the hostname
    prefer-ip-address: true
    # Optional: ensure it binds to the loopback interface if developing locally
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/