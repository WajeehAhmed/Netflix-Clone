databaseChangeLog:
  - changeSet:
      id: 1
      author: netflix-dev
      changes:
        # 1. Create Roles table
        - createTable:
            tableName: roles
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: name, type: varchar(20), constraints: {nullable: false, unique: true}}

        # 2. Create Users table
        - createTable:
            tableName: users
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: username, type: varchar(50), constraints: {nullable: false, unique: true}}
              - column: {name: password, type: varchar(255), constraints: {nullable: false}}

        # 3. Create Join table
        - createTable:
            tableName: user_roles
            columns:
              - column: {name: user_id, type: bigint, constraints: {nullable: false}}
              - column: {name: role_id, type: bigint, constraints: {nullable: false}}

        # 4. Add Constraints for Join table
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

  - changeSet:
      id: 2
      author: netflix-dev
      changes:
        # 5. Initial Seed Data
        - insert:
            tableName: roles
            columns:
              - column: {name: name, value: ROLE_USER}
        - insert:
            tableName: roles
            columns:
              - column: {name: name, value: ROLE_PREMIUM}
        - insert:
            tableName: roles
            columns:
              - column: {name: name, value: ROLE_ADMIN}