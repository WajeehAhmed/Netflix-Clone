server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: JwtAuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"


app:
  jwtSecret: ${JWT_SECRET:o4iosOSBFOzaIP/wRgnE99wdKlF95ihqbA9eCmPWFQySUZafsJxrpOF4PnRmm1EBe7vj4Dt9iX3elKPey+Uucw==}

#logging:
